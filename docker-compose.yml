services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bwa
      POSTGRES_PASSWORD: bwa
      POSTGRES_DB: bwa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bwa -d bwa"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
